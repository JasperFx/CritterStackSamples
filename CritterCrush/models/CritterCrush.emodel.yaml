# The declared Event Model for CritterCrush — the BookingAppointments chapter of the K9CRUSH
# board (Powerworks/K9DatingApp, MIT), imported with `bobcat import-event-model` and then curated.
#
# This file is the source of truth. The code and the specs are generated FROM it; nothing here
# describes code that already exists.
#
# ------------------------------------------------------------------------------------------------
# What the import could not know, and this curation decides
#
# An emlang board export carries NO field information — the board's own comment says the props were
# "intentionally omitted rather than invented". So every `elements:` block and every scenario `with:`
# value below is curation, and it is the whole substance of the file: without it eleven named boxes
# compile into eleven hollow slices.
#
# Four decisions are worth naming, because each is a judgment the board did not make:
#
#   * ONE aggregate, purpose-tagged. The board asked for it in prose — "a single generic,
#     purpose-tagged Appointment concept (HomeCheck | FosterHandover | SurrenderIntake, linking back
#     to the source entity id) reused across three automation entry points rather than three separate
#     booking flows". So `kind` + `sourceId`, not three parallel aggregates and not three id fields.
#
#   * ownerId and shelterId ride on EVERY event. Both views fold many appointment streams into one
#     document — MyAppointments keyed by owner, AppointmentsQueue by shelter — and a multi-stream
#     projection can only route an event that carries the id it groups by. Fan-out routing constrains
#     event shape; that is a modelling consequence, not a workaround.
#
#   * appointmentId is the stream id, and every command carries it as `{streamId}` so the act
#     addresses the stream the Given arranged. Without it a refusal scenario passes by inspecting an
#     empty aggregate and refusing nothing.
#
#   * The APPOINTMENT STREAM IS THE THING THAT ASKED FOR IT — the appointment's stream id is the
#     triggering assignment / foster application / surrender request. Nothing upstream invents an
#     appointment id, and a redelivered trigger collides on StartStream instead of quietly booking a
#     second visit, which is what "design for at-least-once delivery" has to mean for a slice that
#     creates a stream. The scenarios say so with `{streamId}` on the trigger's own id field: the act
#     then reaches the stream the Given arranged, which is also the only way an emitted-event
#     assertion can see it at all.
#
#   * The three trigger events keep the BOARD's names — HomeCheckAssignmentAccepted,
#     DogPlacedInFoster, SurrenderRequestReviewed — not tidier synonyms. They are contracts owned by
#     chapters this model does not contain, so renaming them here would silently fork the contract.
# ------------------------------------------------------------------------------------------------
schema: 1
model: CritterCrush
namespace: CritterCrush

slices:
  # ---- Proposals ---------------------------------------------------------------------------------
  # Three flows elsewhere on the board each end in "somebody needs an appointment". Each is an
  # Automation that STARTS an Appointment stream, and each trigger is raised by a chapter this model
  # does not contain — hence the inbound `externalSystems:` edge, which makes this slice's own file
  # the declared owner of that contract instead of leaving the trigger Dangling.

  - name: ProposeHomeCheckAppointment
    pattern: Automation
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: MessageHandler, label: HomeCheckAssignmentAccepted }
    aggregates: [Appointment]
    events: [HomeCheckAppointmentProposed]
    notes: >
      From chapter 'BookingAppointments', actor 'System'. A volunteer accepted a home-check
      assignment, so the visit needs booking. This slice STARTS the Appointment stream.
    elements:
      Appointment:
        description: One booked visit, whatever flow asked for it
        fields:
          ownerId: Guid
          shelterId: Guid
          kind: string
          sourceId: Guid
          scheduledFor: DateTimeOffset
          status: string
          rescheduleRequested: bool
      # Declared here too, and NOT redundantly: `elements:` resolves per slice, so without this
      # copy the scaffolder sees a trigger with no fields, reads that as "identifiable", and emits
      # a [WriteModel] bind for a message carrying no appointment id — a slice that fails at
      # dispatch. The RECORD comes from the slice that emits it (AcceptHomeCheckAssignment); this
      # copy exists only so the shape decision is made on what the trigger actually carries.
      # bobcat#321.
      HomeCheckAssignmentAccepted:
        fields:
          assignmentId: Guid
          ownerId: Guid
          shelterId: Guid
          volunteerOwnerId: Guid
          proposedFor: DateTimeOffset
      HomeCheckAppointmentProposed:
        description: A home-check visit was proposed and awaits the owner's confirmation
        fields:
          ownerId: Guid
          shelterId: Guid
          kind: string
          sourceId: Guid
          scheduledFor: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: An accepted home check assignment proposes a visit
          when:
            command: ProposeHomeCheckAppointment
            with:
              assignmentId: "{streamId}"
              ownerId: "0e5e0001-0000-0000-0000-000000000001"
              shelterId: "5e110001-0000-0000-0000-000000000001"
              volunteerOwnerId: "0e5e0099-0000-0000-0000-000000000099"
              proposedFor: "2026-10-01T15:00:00Z"
          then:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                kind: HomeCheck
                sourceId: "{streamId}"
                scheduledFor: "2026-10-01T15:00:00Z"

  - name: ProposeFosterHandoverAppointment
    pattern: Automation
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: MessageHandler, label: DogPlacedInFoster }
    externalSystems:
      - { name: Fostering, direction: Inbound }
    aggregates: [Appointment]
    events: [FosterHandoverAppointmentProposed]
    notes: >
      From chapter 'BookingAppointments', actor 'System'. A dog was placed in foster, so the handover
      needs booking. This slice STARTS the Appointment stream.
    elements:
      DogPlacedInFoster:
        description: Fostering placed a dog and needs the handover booked
        fields:
          fosterApplicationId: Guid
          ownerId: Guid
          shelterId: Guid
          proposedFor: DateTimeOffset
      FosterHandoverAppointmentProposed:
        description: A foster handover was proposed and awaits the foster carer's confirmation
        fields:
          ownerId: Guid
          shelterId: Guid
          kind: string
          sourceId: Guid
          scheduledFor: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A dog placed in foster proposes a handover
          when:
            command: ProposeFosterHandoverAppointment
            with:
              fosterApplicationId: "{streamId}"
              ownerId: "0e5e0002-0000-0000-0000-000000000002"
              shelterId: "5e110001-0000-0000-0000-000000000001"
              proposedFor: "2026-10-02T10:30:00Z"
          then:
            - event: FosterHandoverAppointmentProposed
              with:
                ownerId: "0e5e0002-0000-0000-0000-000000000002"
                kind: FosterHandover
                sourceId: "{streamId}"
                scheduledFor: "2026-10-02T10:30:00Z"

  - name: ProposeSurrenderIntakeAppointment
    pattern: Automation
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: MessageHandler, label: SurrenderRequestReviewed }
    externalSystems:
      - { name: Surrenders, direction: Inbound }
    aggregates: [Appointment]
    events: [SurrenderIntakeAppointmentProposed]
    hotspots:
      - >
        One source entity can hold only one appointment, because the source id IS the appointment's
        stream id. A surrender needing a second intake visit — the first one a no-show, say — has
        nowhere to put it. The alternative is a minted id, which costs idempotency on redelivery;
        this model chose idempotency and wrote the cost down.
      - >
        The board's trigger is "Surrender Request Reviewed", and a review can plainly end either way —
        but the board declares no outcome field, so this model cannot say whether a REJECTED review
        also books an intake. Today every reviewed request books one. Resolving it means asking the
        Surrenders chapter to carry the outcome on its contract, which is a change to somebody else's
        event, not to this slice.
    notes: >
      From chapter 'BookingAppointments', actor 'System'. A surrender request was reviewed, so the
      intake needs booking. This slice STARTS the Appointment stream.
    elements:
      SurrenderRequestReviewed:
        description: Surrenders reviewed an owner's request and needs the intake booked
        fields:
          surrenderRequestId: Guid
          ownerId: Guid
          shelterId: Guid
          proposedFor: DateTimeOffset
      SurrenderIntakeAppointmentProposed:
        description: A surrender intake was proposed and awaits the owner's confirmation
        fields:
          ownerId: Guid
          shelterId: Guid
          kind: string
          sourceId: Guid
          scheduledFor: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A reviewed surrender request proposes an intake
          when:
            command: ProposeSurrenderIntakeAppointment
            with:
              surrenderRequestId: "{streamId}"
              ownerId: "0e5e0003-0000-0000-0000-000000000003"
              shelterId: "5e110001-0000-0000-0000-000000000001"
              proposedFor: "2026-10-03T09:00:00Z"
          then:
            - event: SurrenderIntakeAppointmentProposed
              with:
                ownerId: "0e5e0003-0000-0000-0000-000000000003"
                kind: SurrenderIntake
                sourceId: "{streamId}"
                scheduledFor: "2026-10-03T09:00:00Z"

  # ---- The shared lifecycle ----------------------------------------------------------------------
  # Whatever proposed it, an appointment is confirmed, possibly moved, and then closed exactly once.
  # Six HTTP-triggered commands over one stream. Each carries appointmentId as "{streamId}" so the
  # act reaches the stream the Given arranged — without it a refusal scenario passes by inspecting an
  # empty aggregate and refusing nothing.

  - name: ConfirmAppointment
    pattern: Command
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Confirm Appointment }
    command: ConfirmAppointment
    aggregates: [Appointment]
    events: [AppointmentConfirmed]
    notes: From chapter 'BookingAppointments', actor 'Shelter Staff'.
    elements:
      ConfirmAppointment:
        fields:
          appointmentId: Guid
      AppointmentConfirmed:
        description: The counterparty accepted the proposed time
        fields:
          ownerId: Guid
          shelterId: Guid
          confirmedAt: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A proposed appointment is confirmed
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
          when:
            command: ConfirmAppointment
            with: { appointmentId: "{streamId}" }
          then:
            - event: AppointmentConfirmed
              with: { ownerId: "0e5e0001-0000-0000-0000-000000000001" }
        - name: A cancelled appointment cannot be confirmed
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentCancelled
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                wasConfirmed: "false"
                reason: The volunteer withdrew
          when:
            command: ConfirmAppointment
            with: { appointmentId: "{streamId}" }
          then:
            - validationFails: This appointment was cancelled

  - name: RequestReschedule
    pattern: Command
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Request Reschedule }
    command: RequestReschedule
    aggregates: [Appointment]
    events: [AppointmentRescheduleRequested]
    notes: >
      From chapter 'BookingAppointments', actor 'Member'. The counterparty asks for a different time;
      the shelter still owns the move itself.
    elements:
      RequestReschedule:
        fields:
          appointmentId: Guid
          requestedFor: DateTimeOffset
          reason: string
      AppointmentRescheduleRequested:
        description: The counterparty asked for a different time
        fields:
          ownerId: Guid
          shelterId: Guid
          requestedFor: DateTimeOffset
          reason: string
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A member asks to move a confirmed appointment
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
          when:
            command: RequestReschedule
            with:
              appointmentId: "{streamId}"
              requestedFor: "2026-10-05T15:00:00Z"
              reason: Working that afternoon
          then:
            - event: AppointmentRescheduleRequested
              with:
                requestedFor: "2026-10-05T15:00:00Z"
                reason: Working that afternoon
        - name: A completed appointment cannot be rescheduled
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
            - event: AppointmentCompleted
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                completedAt: "2026-10-01T16:00:00Z"
          when:
            command: RequestReschedule
            with:
              appointmentId: "{streamId}"
              requestedFor: "2026-10-05T15:00:00Z"
              reason: Working that afternoon
          then:
            - validationFails: This appointment is already closed

  - name: RescheduleAppointment
    pattern: Command
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Reschedule Appointment }
    command: RescheduleAppointment
    aggregates: [Appointment]
    events: [AppointmentRescheduled]
    hotspots:
      - >
        The board draws Reschedule only downstream of Request Reschedule, so this model refuses a
        move nobody asked for. Whether the shelter may move an appointment unilaterally — a vet
        running late, a volunteer calling in sick — is undecided, and the board cannot settle it.
    notes: From chapter 'BookingAppointments', actor 'Shelter Staff'.
    elements:
      RescheduleAppointment:
        fields:
          appointmentId: Guid
          scheduledFor: DateTimeOffset
      AppointmentRescheduled:
        description: The shelter moved the appointment to a new time
        fields:
          ownerId: Guid
          shelterId: Guid
          scheduledFor: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: The shelter moves an appointment a member asked to move
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
            - event: AppointmentRescheduleRequested
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                requestedFor: "2026-10-05T15:00:00Z"
                reason: Working that afternoon
          when:
            command: RescheduleAppointment
            with:
              appointmentId: "{streamId}"
              scheduledFor: "2026-10-05T15:00:00Z"
          then:
            - event: AppointmentRescheduled
              with:
                scheduledFor: "2026-10-05T15:00:00Z"
        - name: An appointment nobody asked to move is not moved
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
          when:
            command: RescheduleAppointment
            with:
              appointmentId: "{streamId}"
              scheduledFor: "2026-10-05T15:00:00Z"
          then:
            - validationFails: Nobody asked to move this appointment

  - name: CompleteAppointment
    pattern: Command
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Complete Appointment }
    command: CompleteAppointment
    aggregates: [Appointment]
    events: [AppointmentCompleted]
    notes: From chapter 'BookingAppointments', actor 'Shelter Staff'.
    elements:
      CompleteAppointment:
        fields:
          appointmentId: Guid
      AppointmentCompleted:
        description: The visit happened
        fields:
          ownerId: Guid
          shelterId: Guid
          completedAt: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A confirmed appointment is completed
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
          when:
            command: CompleteAppointment
            with: { appointmentId: "{streamId}" }
          then:
            - event: AppointmentCompleted
              with: { ownerId: "0e5e0001-0000-0000-0000-000000000001" }
        - name: An appointment nobody confirmed is not completed
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
          when:
            command: CompleteAppointment
            with: { appointmentId: "{streamId}" }
          then:
            - validationFails: This appointment has not been confirmed

  - name: CancelAppointment
    pattern: Command
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Cancel Appointment }
    command: CancelAppointment
    aggregates: [Appointment]
    events: [AppointmentCancelled]
    notes: From chapter 'BookingAppointments', actor 'Shelter Staff'.
    elements:
      CancelAppointment:
        fields:
          appointmentId: Guid
          reason: string
      AppointmentCancelled:
        description: >
          The appointment will not happen. `wasConfirmed` is carried because the counting views
          cannot otherwise know which of their buckets this appointment was sitting in, and the
          aggregate is the only place that knows — a projection has no prior state to consult.
        fields:
          ownerId: Guid
          shelterId: Guid
          wasConfirmed: bool
          reason: string
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A confirmed appointment is cancelled
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
          when:
            command: CancelAppointment
            with:
              appointmentId: "{streamId}"
              reason: The volunteer withdrew
          then:
            - event: AppointmentCancelled
              with: { wasConfirmed: "true", reason: The volunteer withdrew }
        - name: A completed appointment cannot be cancelled
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
            - event: AppointmentCompleted
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                completedAt: "2026-10-01T16:00:00Z"
          when:
            command: CancelAppointment
            with:
              appointmentId: "{streamId}"
              reason: The volunteer withdrew
          then:
            - validationFails: This appointment is already closed

  - name: RecordAppointmentNoShow
    pattern: Command
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Record Appointment No-Show }
    command: RecordAppointmentNoShow
    aggregates: [Appointment]
    events: [AppointmentNoShowRecorded]
    notes: From chapter 'BookingAppointments', actor 'Shelter Staff'.
    elements:
      RecordAppointmentNoShow:
        fields:
          appointmentId: Guid
      AppointmentNoShowRecorded:
        description: The counterparty never arrived
        fields:
          ownerId: Guid
          shelterId: Guid
          recordedAt: DateTimeOffset
    specifications:
      feature: BookingAppointments
      scenarios:
        - name: A no-show is recorded against a confirmed appointment
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
          when:
            command: RecordAppointmentNoShow
            with: { appointmentId: "{streamId}" }
          then:
            - event: AppointmentNoShowRecorded
              with: { ownerId: "0e5e0001-0000-0000-0000-000000000001" }
        - name: A completed appointment cannot be marked a no-show
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
            - event: AppointmentConfirmed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
            - event: AppointmentCompleted
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                completedAt: "2026-10-01T16:00:00Z"
          when:
            command: RecordAppointmentNoShow
            with: { appointmentId: "{streamId}" }
          then:
            - validationFails: This appointment is already closed

  # ---- The two views -----------------------------------------------------------------------------
  # Both fold MANY appointment streams into ONE document — the queue by shelter, the page by owner —
  # so both are multi-stream, and both need an identity the event itself carries.
  #
  # `consumedEvents:` is declared in full rather than left as the import found it. The import fills
  # it from the `e:` steps preceding a `v:` on the board, which gave the queue three proposals and
  # gave MyAppointments nothing at all (the board puts the two `v:` steps side by side, so the second
  # inherits no events — the import says so). Type lists merge by EQUALITY, not union, so a view that
  # declares fewer events than its projection applies is a SourceDisagreement, correctly: the view is
  # under-specified. Every event that moves an appointment between these counts is listed — and only
# those: a reschedule, requested or carried out, moves an appointment between no two counts, so
# neither view consumes one. Declaring an event a projection never applies is the same
# disagreement in the other direction.

  - name: AppointmentsQueue
    pattern: View
    domain: Scheduling
    chapter: BookingAppointments
    trigger: { kind: Http, label: Appointments Queue }
    aggregates: [Appointment]
    projections: [AppointmentsQueueProjection]
    readModels: [AppointmentsQueue]
    fanOut: true
    consumedEvents:
      - HomeCheckAppointmentProposed
      - FosterHandoverAppointmentProposed
      - SurrenderIntakeAppointmentProposed
      - AppointmentConfirmed
      - AppointmentCompleted
      - AppointmentCancelled
      - AppointmentNoShowRecorded
    notes: >
      From chapter 'BookingAppointments', actor 'Shelter Staff'. One document per SHELTER, counting
      the shelter's appointments by where they are in the lifecycle. Eventually consistent — the
      async daemon owns it.
    elements:
      AppointmentsQueue:
        description: What one shelter still has to deal with
        fields:
          shelterId: Guid
          awaitingConfirmation: int
          confirmed: int
          closed: int
    specifications:
      feature: AppointmentsQueue
      scenarios:
        - name: The queue counts appointments from every stream in the shelter
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0001-0000-0000-0000-000000000001"
                shelterId: "5e110001-0000-0000-0000-000000000001"
