      - AppointmentCancelled
      - AppointmentNoShowRecorded
    notes: >
      From chapter 'BookingAppointments', actor 'Member'. One document per OWNER. An owner reached by
      two different flows — a home check and a surrender intake — has two appointment streams and one
      page, which is the whole reason this projection is multi-stream rather than a snapshot.
    elements:
      MyAppointments:
        description: Every appointment one person has, wherever it came from
        fields:
          ownerId: Guid
          awaitingConfirmation: int
          confirmed: int
          closed: int
    specifications:
      feature: MyAppointments
      scenarios:
        - name: An owner sees an appointment awaiting their confirmation
          given:
            - event: HomeCheckAppointmentProposed
              with:
                ownerId: "0e5e0004-0000-0000-0000-000000000004"
                shelterId: "5e110001-0000-0000-0000-000000000001"
                kind: HomeCheck
                scheduledFor: "2026-10-01T15:00:00Z"
          then:
            - readModel: MyAppointments
              id: "0e5e0004-0000-0000-0000-000000000004"
              contains:
